<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h1>OpenUP</h1>
      <p>Iniciar Sesión</p>
    </div>

    <form (ngSubmit)="onSubmit($event)" class="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="username"
          placeholder="Ingrese su usuario"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Ingrese su contraseña"
          [disabled]="isLoading"
          required
        />
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-login" [disabled]="isLoading">
        {{ isLoading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <div class="login-footer">
      <p class="demo-info">Usuarios de demostración:</p>
      <ul class="demo-users">
        <li><strong>admin</strong> / admin123 (Administrador)</li>
        <li><strong>autor1</strong> / autor123 (Autor)</li>
        <li><strong>revisor1</strong> / revisor123 (Revisor)</li>
      </ul>
    </div>
  </div>
</div>
